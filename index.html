    <!-- Proteção contra estruturas circulares em rastreadores e pixels de terceiros -->
    <script>
      (function() {
        var origStringify = JSON.stringify;
        JSON.stringify = function(value, replacer, space) {
          var seen = new WeakSet();
          var safeReplacer = function(key, val) {
            if (val !== null && typeof val === "object") {
              if (seen.has(val)) {
                return "[Circular]";
              }
              seen.add(val);
            }
            if (typeof replacer === "function") {
              return replacer(key, val);
            }
            return val;
          };
          try {
            return origStringify(value, safeReplacer, space);
          } catch (e) {
            try {
              return origStringify(value, null, space);
            } catch (err2) {
              return "{}";
            }
          }
        };
      })();
    </script>

    <!-- Injeção e Persistência Automática de UTMs na URL -->
    <script>
      (function() {
        try {
          var url = new URL(window.location.href);
          var searchParams = url.searchParams;
          var hasUtms = searchParams.has('utm_source') || searchParams.has('utm_campaign');

          if (hasUtms) {
            // Salva as UTMs reais trazidas pelo anúncio ou campanha
            localStorage.setItem('saved_utms', url.search);
          } else {
            // Se o visitante não tem UTMs na URL atual, restaura da visita anterior ou injeta padrão
            var saved = localStorage.getItem('saved_utms');
            if (saved && saved.startsWith('?')) {
              var savedParams = new URLSearchParams(saved);
              savedParams.forEach(function(val, key) {
                if (!searchParams.has(key)) {
                  searchParams.set(key, val);
                }
              });
            } else {
              // Visitante direto: injeta parâmetros padrão para sempre manter a URL ativa com UTMs
              searchParams.set('utm_source', 'direto');
              searchParams.set('utm_medium', 'organico');
              searchParams.set('utm_campaign', 'cpa_chines');
              searchParams.set('utm_content', 'site');
            }

            // Atualiza a URL na barra de endereços do navegador instantaneamente sem recarregar a página
            var newRelativePathQuery = url.pathname + '?' + searchParams.toString() + url.hash;
            window.history.replaceState(null, '', newRelativePathQuery);
          }
        } catch (e) {
          // Ignora silenciosamente
        }
      })();
    </script>
